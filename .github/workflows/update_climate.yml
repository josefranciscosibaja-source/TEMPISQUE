name: Actualizar clima desde GEE

on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Recalcular todo el histórico desde 1981"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 6 * * *"
      timezone: "America/Costa_Rica"

permissions:
  contents: write

concurrency:
  group: actualizacion-climatica-gee
  cancel-in-progress: false

jobs:
  actualizar:
    name: Actualizar CHIRPS, ERA5-Land y SPI
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-update.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-update.txt

      - name: Verificar que el secreto existe
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
        run: |
          python -c "import os, sys; sys.exit(0 if os.environ.get('GEE_SERVICE_ACCOUNT_JSON', '').strip() else 'Falta el secreto GEE_SERVICE_ACCOUNT_JSON')"

      - name: Actualización incremental
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.full_refresh != true }}
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/update_climate.py

      - name: Reconstrucción completa solicitada
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_refresh == true }}
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/update_climate.py --full-refresh

      - name: Guardar productos actualizados en GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/clima_guardia_gee.csv \
            data/spi_guardia_gee.csv \
            data/cuenca_aportante_guardia_gee.geojson \
            data/actualizacion_climatica.json

          if git diff --cached --quiet; then
            echo "GEE todavía no presenta datos nuevos. No se requiere commit."
            exit 0
          fi

          git commit -m "datos: actualizar clima desde GEE"
          git pull --rebase
          git push
